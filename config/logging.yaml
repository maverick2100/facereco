version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s %(levelname)-7s [%(threadName)s] %(name)s: %(message)s"
  events:
    format: "%(asctime)s %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

  file:
    class: logging.handlers.RotatingFileHandler
    level: DEBUG
    formatter: standard
    filename: face_recognition.log   # placed inside logs/ automatically
    maxBytes: 20971520
    backupCount: 5
    encoding: utf-8

  events_file:
    class: logging.handlers.TimedRotatingFileHandler
    level: INFO
    formatter: events
    filename: events.log
    when: midnight
    backupCount: 30
    encoding: utf-8

loggers:
  events:
    level: INFO
    handlers: [events_file, console]
    propagate: false

root:
  level: INFO
  handlers: [console, file]
